[project]
name = "bookly-ai"
version = "0.1.0"
description = "Bookly AI assistant: text from Web Speech API in, booking via Go backend out"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "openai>=1.60",
    "redis>=5.2",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "dishka>=1.4",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
